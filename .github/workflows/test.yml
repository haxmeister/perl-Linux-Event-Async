name: test

on:
  push:
  pull_request:

jobs:
  perl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Linux::Event::Async
        uses: actions/checkout@v4
        with:
          path: async

      - name: Check out historical Direct Awaitable
        uses: actions/checkout@v4
        with:
          repository: haxmeister/perl-linux-event
          ref: experiment/direct-awaitable
          path: direct-event

      - name: Check out Linux::Event main
        uses: actions/checkout@v4
        with:
          repository: haxmeister/perl-linux-event
          ref: main
          path: linux-event

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Install build dependencies
        run: |
          cpanm --notest Future::AsyncAwait
          cd direct-event
          cpanm --notest --installdeps .
          cd ../linux-event
          cpanm --notest --installdeps .

      - name: Build historical Direct Awaitable
        run: |
          cd direct-event
          perl Makefile.PL
          make -j2

      - name: Benchmark historical Direct Awaitable
        run: |
          cd direct-event
          perl -Mblib ../async/bench/run-direct-awaitable-reference.pl --repeat=7 --warmup=2

      - name: Build and install Linux::Event main
        run: |
          cd linux-event
          perl Makefile.PL
          make -j2
          make test
          make install

      - name: Build and test Linux::Event::Async
        run: |
          cd async
          perl Makefile.PL
          make -j2
          make test
          make disttest

      - name: Benchmark Linux::Event::Async::Stream
        run: |
          cd async
          perl -Mblib bench/run-async-stream-native-bench.pl --repeat=7 --warmup=2
